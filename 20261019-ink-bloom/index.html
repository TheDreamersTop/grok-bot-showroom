<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨華 Ink Bloom</title>
<link rel="icon" href="data:,">
<meta name="description" content="Drop ink into a still tank and watch it branch into a vortex-ring cascade. Desktop WebGL2.">
<meta property="og:title" content="墨華 Ink Bloom"><meta property="og:image" content="og.jpg">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e8e3d9;cursor:none;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Songti TC","Noto Serif TC","PMingLiU",serif;color:#2a2622;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#title{position:fixed;left:4.2vw;top:3.2vh;pointer-events:none;transition:opacity 2s}
#title h1{margin:0;font-weight:400;font-size:28px;letter-spacing:.32em}
#title h1 span{font-size:15px;letter-spacing:.28em;margin-left:.9em;opacity:.7;font-style:italic}
#title p{margin:.5em 0 0;font-size:12.5px;letter-spacing:.12em;opacity:.55}
#inks{position:fixed;left:50%;bottom:3.4vh;transform:translateX(-50%);display:flex;gap:22px;align-items:flex-end;cursor:default}
.ink{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;opacity:.62;transition:opacity .3s,transform .3s}
.ink:hover{opacity:.9}.ink.on{opacity:1;transform:translateY(-3px)}
.ink i{display:block;width:15px;height:15px;border-radius:50%;box-shadow:inset -2px -3px 4px rgba(0,0,0,.35),inset 2px 2px 3px rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.2)}
.ink b{font-weight:400;font-size:11px;letter-spacing:.15em;white-space:nowrap}
#keys{position:fixed;right:3.6vw;bottom:3.6vh;font-size:11px;letter-spacing:.1em;opacity:.42;text-align:right;line-height:1.7;pointer-events:none}
#nogl{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;font-size:16px;letter-spacing:.1em}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>墨華<span>Ink Bloom</span></h1><p>click the water · 輕點水面</p></div>
<div id="inks"></div>
<div id="keys">hold = bigger drop · drag = stir<br>space = slow time · R = fresh water · M = sound</div>
<div id="nogl">墨華 Ink Bloom needs desktop Chrome with WebGL2.</div>
<script src="main.js"></script>
</body></html>
